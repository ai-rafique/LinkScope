name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # No brokers or serial hardware on CI: broker/hardware suites skip themselves.
      SKIP_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build --no-daemon --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: build/reports/tests/test
          if-no-files-found: ignore

  package:
    name: app image (windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # jpackageImage builds the trimmed runtime + launcher without needing WiX;
      # the MSI (./gradlew jpackage) needs the WiX toolset and is left to a release workflow.
      - name: Build app image
        run: ./gradlew jpackageImage --no-daemon --console=plain

      - name: Upload app image
        uses: actions/upload-artifact@v4
        with:
          name: LinkScope-windows-app-image
          path: build/jpackage/LinkScope
