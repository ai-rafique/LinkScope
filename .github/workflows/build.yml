name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # No brokers or serial hardware on CI: broker/hardware suites skip themselves.
      SKIP_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build --no-daemon --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: build/reports/tests/test
          if-no-files-found: ignore

  package-linux:
    name: deb and tarball (linux)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      # jpackage's .deb needs dpkg-deb and fakeroot; both ship on the Ubuntu runner image.
      - name: Build .deb and portable tarball
        run: ./gradlew linuxDeb appImageTar --no-daemon --console=plain

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: LinkScope-linux
          path: build/installer/*

  package:
    name: installer (windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Inno Setup 6 is preinstalled on the windows-latest runner image; jpackageImage runs first.
      - name: Build installer and portable zip
        run: ./gradlew innoSetup appImageZip --no-daemon --console=plain

      - name: Upload installer and portable zip
        uses: actions/upload-artifact@v4
        with:
          name: LinkScope-windows
          path: build/installer/*
